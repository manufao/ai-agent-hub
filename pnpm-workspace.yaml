# pnpm reads its settings from this file, not from a "pnpm" field in
# package.json.

# pnpm blocks dependency install scripts by default, so each one has to be
# allowed by name. These compile/download native binaries and genuinely
# need it; every other dependency stays blocked, which is the point.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

# Refuse to install a dependency that declares itself incompatible with the
# running Node version. pnpm 12 does not read this from .npmrc.
engineStrict: true
