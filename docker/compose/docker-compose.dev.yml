services:
  dev-app:
    image: node:22
    working_dir: /app
    volumes:
      - ../../:/app
      - node_modules:/app/node_modules
      - ../../dist:/app/dist
      - ../../public:/app/public
    command: bash -c "npm install -g --no-audit --no-fund corepack@0.36.0 && corepack enable && pnpm install && pnpm run start:dev"
    ports:
      - "3000:3000"

volumes:
  node_modules:
