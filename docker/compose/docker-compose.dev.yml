services:
  dev-app:
    image: node:22
    working_dir: /app
    volumes:
      - ../../:/app
      - node_modules:/app/node_modules
      - ../../dist:/app/dist
      - ../../public:/app/public
    command: bash -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"

volumes:
  node_modules:
