# Mises à jour automatiques : une PR groupée par semaine et par écosystème.
# `npm` couvre aussi pnpm (Dependabot lit pnpm-lock.yaml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
